# EXEMPLE de Secrets — NE JAMAIS committer les vraies valeurs.
# Copier en secret.yaml (git-ignoré) et remplir, OU créer via kubectl/scellé.
#
# Création recommandée sans fichier en clair :
#   kubectl -n toilettage create secret generic toilettage-db-secret \
#     --from-literal=POSTGRES_USER=toilettage \
#     --from-literal=POSTGRES_PASSWORD='<mot-de-passe-fort>' \
#     --from-literal=POSTGRES_DB=toilettage
#
#   kubectl -n toilettage create secret generic toilettage-api-secret \
#     --from-literal=POSTGRES_USER=toilettage \
#     --from-literal=POSTGRES_PASSWORD='<meme-mot-de-passe>' \
#     --from-literal=SMTP_HOST='<smtp-soria>' \
#     --from-literal=SMTP_PORT='587' \
#     --from-literal=SMTP_USER='<user>' \
#     --from-literal=SMTP_PASSWORD='<pass>' \
#     --from-literal=SMTP_FROM='<from@domaine>' \
#     --from-literal=GROOMER_NOTIFICATION_EMAIL='<toiletteur@domaine>'
#
# Le pull secret Harbor (harbor-regcred) doit aussi exister dans le namespace :
#   kubectl -n toilettage create secret docker-registry harbor-regcred \
#     --docker-server=harbor.proxbenovh.cloud \
#     --docker-username='<user>' --docker-password='<pass>'
---
apiVersion: v1
kind: Secret
metadata:
  name: toilettage-db-secret
  namespace: toilettage
type: Opaque
stringData:
  POSTGRES_USER: "toilettage"
  POSTGRES_PASSWORD: "CHANGE_ME"
  POSTGRES_DB: "toilettage"
---
apiVersion: v1
kind: Secret
metadata:
  name: toilettage-api-secret
  namespace: toilettage
type: Opaque
stringData:
  POSTGRES_USER: "toilettage"
  POSTGRES_PASSWORD: "CHANGE_ME"
  SMTP_HOST: "CHANGE_ME"
  SMTP_PORT: "587"
  SMTP_USER: "CHANGE_ME"
  SMTP_PASSWORD: "CHANGE_ME"
  SMTP_FROM: "CHANGE_ME"
  SMTP_USE_TLS: "true"
  GROOMER_NOTIFICATION_EMAIL: "CHANGE_ME"
